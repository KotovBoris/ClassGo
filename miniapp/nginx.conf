server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Сжатие: JS-бандл ~320 КБ → ~96 КБ по сети, CSS ~15 КБ, JSON ответов API.
    # Без этого mini-app грузит несжатый бандл (замер ST-8: JS 315 КБ без gzip).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml application/manifest+json
        image/svg+xml;

    # ВАЖНО: без этого nginx кэширует IP backend при старте, и после
    # пересоздания контейнера backend (docker compose up -d --build backend)
    # отдаёт 502, пока не перезапустишь miniapp. Используем DNS Docker
    # (127.0.0.11) и переменную в proxy_pass, чтобы резолвить при каждом запросе.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    # SPA: любые внутренние маршруты отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html меняется с каждым релизом (в нём хэши ассетов) — не кэшируем,
    # иначе клиент останется на старом бандле после деплоя.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Собранные ассеты содержат хэш в имени — их можно кэшировать «навсегда».
    # Повторные открытия mini-app не перезагружают JS/CSS вовсе.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Шрифты (woff2) неизменяемы — кэшируем надолго.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { font/woff2 woff2; }
    }

    # REST API ядра → backend
    location /api/ {
        # Билеты из мини-приложения: файл до 10 МБ (проверяет backend) плюс поля формы.
        # По умолчанию у nginx 1 МБ, а фото с телефона весит 2–6 МБ.
        client_max_body_size 12m;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/OpenAPI ядра (п. DoD: /docs доступен)
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проверка живости
    location = /healthz {
        proxy_pass $backend/healthz;
        proxy_set_header Host $host;
    }

    # Приём обновлений MAX (если выбран режим webhook)
    location /webhook/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
