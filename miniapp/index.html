<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ClassGo — школьные выезды в MAX</title>
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)" />
    <!-- Соединение с MAX Bridge открываем заранее: сам скрипт 21 КБ и отвечает ~0.4 с -->
    <link rel="preconnect" href="https://st.max.ru" crossorigin />
    <link rel="dns-prefetch" href="https://st.max.ru" />
    <!-- MAX Bridge: официальная библиотека платформы (глобальный объект window.WebApp).
         defer — скрипт не блокирует разбор и первую отрисовку; порядок с module-скриптом
         приложения сохраняется (оба отложены, исполняются в порядке документа). -->
    <script defer src="https://st.max.ru/js/max-web-app.js"></script>
    <!-- Заставка до загрузки скриптов: без неё MAX секунду-две показывает пустую панель. -->
    <style>
      .cg-splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px;
        background: #f5f7fa; color: #5c6370; font: 16px -apple-system, system-ui, Roboto, sans-serif; }
      .cg-splash i { width: 56px; height: 56px; border-radius: 16px; background: #007aff; }
      .cg-splash span::after { content: ""; animation: cg-dots 1.2s steps(4) infinite; }
      @keyframes cg-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
      @media (prefers-color-scheme: dark) { .cg-splash { background: #17181c; color: #a0a6b0; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="cg-splash" aria-busy="true"><i></i><span>Открываем ClassGo</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
