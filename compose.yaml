# ClassGo — запуск всех локальных компонентов одной командой:
#   docker compose up --build
#
# Компоненты (модульный монолит, логически разделён):
#   backend  — REST API ядра + MAX Bot Adapter (long polling / webhook), порт 8000
#   miniapp  — статика mini-app (React + MAX UI) + прокси /api на backend, порт 8080
#
# Публичные адреса после старта:
#   mini-app (веб):  http://localhost:8080
#   Swagger ядра:    http://localhost:8080/docs   (и http://localhost:8000/docs)
#   health:          http://localhost:8080/healthz
#
# Секреты берутся из .env (см. .env.example). В репозитории токенов нет.

services:
  # ---- PostgreSQL (опционально) ------------------------------------------
  # Включается профилем:  docker compose --profile postgres up -d --build
  # и DATABASE_URL=postgresql+psycopg2://classgo:classgo@db:5432/classgo в .env
  # По умолчанию используется SQLite (ноль настройки, файл в томе).
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classgo}
      POSTGRES_USER: ${POSTGRES_USER:-classgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classgo}
    volumes:
      - classgo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classgo} -d ${POSTGRES_DB:-classgo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: classgo-backend:1.0.0
    depends_on:
      # db требуется только при включённом профиле postgres
      db:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/classgo.db}"
      AUTO_SEED: "${AUTO_SEED:-true}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # MAX: токен задаётся в .env; без него бот не запускается, REST/mini-app работают
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_API_BASE: "${MAX_API_BASE:-https://platform-api2.max.ru}"
      MAX_BOT_MODE: "${MAX_BOT_MODE:-polling}"
      MAX_BOT_USERNAME: "${MAX_BOT_USERNAME:-}"
      MAX_WEBHOOK_URL: "${MAX_WEBHOOK_URL:-}"
      MAX_WEBHOOK_SECRET: "${MAX_WEBHOOK_SECRET:-}"
      # TLS до MAX (сертификаты Минцифры): путь к PEM либо демо-режим без проверки
      MAX_CA_BUNDLE: "${MAX_CA_BUNDLE:-}"
      MAX_TLS_INSECURE: "${MAX_TLS_INSECURE:-0}"
      MINIAPP_BASE_URL: "${MINIAPP_BASE_URL:-http://localhost:8080}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
    volumes:
      - classgo-data:/app/data
      # Каталог с корневым сертификатом Минцифры (если файл положили — смонтируется)
      - ./certs:/certs:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  miniapp:
    build:
      context: ./miniapp
    image: classgo-miniapp:1.0.0
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  classgo-data:
  # Данные PostgreSQL (используется только с профилем postgres)
  classgo-pg:
